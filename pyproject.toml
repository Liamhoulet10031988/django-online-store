[project]
name = "django-online-store"
version = "0.1.0"
description = "Интернет-магазин на Django"
authors = [
    {name = "Liamhoulet10031988",email = "liam10031988@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "ipython (>=9.16.0,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.isort]
profile = "black"
line_length = 79
skip = [".venv", "static", "catalog/migrations"]

[dependency-groups]
dev = [
    "coverage (>=7.15.2,<8.0.0)"
]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
