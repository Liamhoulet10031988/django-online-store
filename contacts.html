<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">
        <aside class="col-3 col-md-2 p-3 text-bg-dark d-flex flex-column">
            <header>
                <a class="text-white text-decoration-none fs-4" href="index.html">
                    B Магазин
                </a>
            </header>

            <hr>

            <nav class="nav nav-pills flex-column mb-auto">
                <a class="nav-link" href="index.html">Главная</a>
                <a class="nav-link text-white" href="category.html">Категории</a>
                <a class="nav-link text-white" href="#">Заказы</a>
                <a class="nav-link active" href="contacts.html">Контакты</a>
            </nav>

            <footer class="mt-auto">
                <hr>
                <p class="mb-1">Профиль</p>
                <p class="mb-1">Выход</p>
                <strong>Пользователь</strong>
            </footer>
        </aside>

        <main class="col-9 col-md-10 py-5">
            <div class="container">
                <h1 class="text-center mb-5">Контакты</h1>

                <div class="row g-5 justify-content-center">
                    <div class="col-12 col-lg-5">
                        <form action="/" method="post">
                            <div class="mb-3">
                                <label class="form-label" for="name">Имя</label>
                                <input
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    type="text"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Почта</label>
                                <input
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    type="email"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="message">Сообщение</label>
                                <textarea
                                    class="form-control"
                                    id="message"
                                    name="message"
                                    rows="4"
                                    required
                                ></textarea>
                            </div>

                            <button class="btn btn-primary" type="submit">
                                Отправить
                            </button>
                        </form>
                    </div>

                    <div class="col-12 col-lg-5">
                        <h2 class="fs-4">Наши контакты</h2>
                        <p>
                            Мы поможем подобрать товар и ответим на вопросы
                            о заказе, оплате и доставке.
                        </p>
                        <p>Телефон: +7 (900) 000-00-00</p>
                        <p>Электронная почта: shop@example.com</p>
                        <p>Адрес: Москва, ул. Примерная, д. 1</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
