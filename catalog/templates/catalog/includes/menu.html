<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'catalog:home' %}">
            Skystore
        </a>
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainMenu"
            aria-controls="mainMenu"
            aria-expanded="false"
            aria-label="Открыть меню"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainMenu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'catalog:home' %}">
                    Каталог
                </a>

                {% if user.is_authenticated %}
                    <a
                        class="nav-link"
                        href="{% url 'catalog:product_create' %}"
                    >
                        Добавить товар
                    </a>
                {% endif %}

                <a class="nav-link" href="{% url 'blog:blog_list' %}">
                    Блог
                </a>
                <a class="nav-link" href="{% url 'catalog:contacts' %}">
                    Контакты
                </a>

                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'users:profile' %}">
                        {{ user.email }}
                    </a>
                    <form method="post" action="{% url 'users:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">
                        Войти
                    </a>
                    <a class="nav-link" href="{% url 'users:register' %}">
                        Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
